<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-Dairy - Milk Management System</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --secondary-color: #4299e1;
            --background-color: #f7fafc;
            --card-background: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-color);
        }

        .card {
            background: var(--card-background);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .summary-item {
            background: #ebf8ff;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid var(--primary-color);
        }

        .summary-item .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 5px;
        }

        .entry-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .entry-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .entry-item:last-child {
            border-bottom: none;
        }

        .delete-btn {
            background-color: #e53e3e;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            width: auto;
        }

        .delete-btn:hover {
            background-color: #c53030;
        }

        .loading-status {
            text-align: center;
            color: #718096;
            font-style: italic;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>L-Dairy</h1>
            <p>Milk Management System</p>
        </header>

        <div id="loadingStatus" class="loading-status">Firebase से डेटा लोड हो रहा है...</div>

        <div class="card">
            <h2>दूध की कीमत (Price Setup)</h2>
            <div class="form-group">
                <label for="milkPrice">प्रति लीटर कीमत (₹):</label>
                <input type="number" id="milkPrice" value="60" min="0">
            </div>
            <button id="savePriceBtn">कीमत अपडेट करें</button>
        </div>

        <div class="card">
            <h2>रोजाना एंट्री (Daily Entry)</h2>
            <div class="form-group">
                <label for="entryDate">तारीख:</label>
                <input type="date" id="entryDate">
            </div>
            <div class="form-group">
                <label for="milkQuantity">दूध की मात्रा (Liters):</label>
                <input type="number" id="milkQuantity" step="0.1" min="0" placeholder="0.0">
            </div>
            <div class="form-group">
                <label for="advancePaid">एडवांस दिया (₹):</label>
                <input type="number" id="advancePaid" min="0" value="0">
            </div>
            <button id="addEntryBtn">एंट्री सेव करें</button>
        </div>

        <div class="card">
            <h2>इस महीने का हिसाब (Summary)</h2>
            <div class="summary-grid">
                <div class="summary-item">
                    <div>कुल दूध (Total Milk)</div>
                    <div id="totalMilk" class="value">0 L</div>
                </div>
                <div class="summary-item">
                    <div>कुल रकम (Total Amount)</div>
                    <div id="totalAmount" class="value">₹0</div>
                </div>
                <div class="summary-item">
                    <div>कुल एडवांस (Total Advance)</div>
                    <div id="totalAdvance" class="value">₹0</div>
                </div>
                <div class="summary-item">
                    <div>बाकी राशि (Net Due)</div>
                    <div id="netDue" class="value">₹0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>एंट्री हिस्ट्री (History)</h2>
            <div id="entryList" class="entry-list">
                </div>
        </div>
    </div>

    <script type="module">
        // Firebase Libraries Import
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAuUomqZ5DFYl67aUtmozewAbAEyVCTH4c",
            authDomain: "i-dairy-31519.firebaseapp.com",
            databaseURL: "https://i-dairy-31519-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "i-dairy-31519",
            storageBucket: "i-dairy-31519.firebasestorage.app",
            messagingSenderId: "44893881023",
            appId: "1:44893881023:web:19fd0f3e30bb36462efc0a",
            measurementId: "G-1BWN5X6MBD"
        };

        // Initialize Firebase & Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // App State
        let currentPrice = 60;
        let dairyEntries = {};

        // DOM Elements
        const milkPriceInput = document.getElementById('milkPrice');
        const entryDateInput = document.getElementById('entryDate');
        const milkQuantityInput = document.getElementById('milkQuantity');
        const advancePaidInput = document.getElementById('advancePaid');
        const entryList = document.getElementById('entryList');
        const loadingStatus = document.getElementById('loadingStatus');

        // Set default date to today
        entryDateInput.value = new Date().toISOString().split('T')[0];

        // 1. Fetch Price from Firebase
        const priceRef = ref(db, 'milkPrice');
        onValue(priceRef, (snapshot) => {
            if (snapshot.exists()) {
                currentPrice = snapshot.val();
                milkPriceInput.value = currentPrice;
            }
            calculateSummary();
        });

        // 2. Fetch Entries from Firebase Live
        const entriesRef = ref(db, 'entries');
        onValue(entriesRef, (snapshot) => {
            loadingStatus.style.display = 'none';
            if (snapshot.exists()) {
                dairyEntries = snapshot.val();
                renderEntries();
            } else {
                dairyEntries = {};
                entryList.innerHTML = '<p style="text-align:center; color:#718096;">कोई एंट्री नहीं मिली।</p>';
                renderEntries();
            }
            calculateSummary();
        });

        // Save Price Function
        document.getElementById('savePriceBtn').addEventListener('click', () => {
            const price = parseFloat(milkPriceInput.value);
            if (!isNaN(price) && price >= 0) {
                set(priceRef, price)
                    .then(() => alert('कीमत सफलतापूर्वक अपडेट हो गई!'))
                    .catch((err) => alert('Error saving price: ' + err.message));
            }
        });

        // Add Entry Function
        document.getElementById('addEntryBtn').addEventListener('click', () => {
            const date = entryDateInput.value;
            const quantity = parseFloat(milkQuantityInput.value);
            const advance = parseFloat(advancePaidInput.value) || 0;

            if (!date || isNaN(quantity) || quantity <= 0) {
                alert('कृपया सही तारीख और दूध की मात्रा भरें!');
                return;
            }

            const newEntry = {
                date: date,
                quantity: quantity,
                advance: advance,
                timestamp: Date.now()
            };

            // Push data online to Firebase
            push(entriesRef, newEntry)
                .then(() => {
                    // Reset input fields
                    milkQuantityInput.value = '';
                    advancePaidInput.value = '0';
                    alert('एंट्री लाइव सेव हो गई!');
                })
                .catch((err) => alert('Error saving entry: ' + err.message));
        });

        // Render Entries List
        function renderEntries() {
            entryList.innerHTML = '';
            
            // Convert object to array and sort by date descending
            const sortedKeys = Object.keys(dairyEntries).sort((a, b) => {
                return new Date(dairyEntries[b].date) - new Date(dairyEntries[a].date);
            });

            if(sortedKeys.length === 0) {
                entryList.innerHTML = '<p style="text-align:center; color:#718096;">कोई एंट्री नहीं मिली।</p>';
                return;
            }

            sortedKeys.forEach(key => {
                const entry = dairyEntries[key];
                const div = document.createElement('div');
                div.className = 'entry-item';
                div.innerHTML = `
                    <div>
                        <strong>${entry.date}</strong> - ${entry.quantity} L 
                        ${entry.advance > 0 ? `<span style="color: green; margin-left:10px;">(Adv: ₹${entry.advance})</span>` : ''}
                    </div>
                    <button class="delete-btn" data-key="${key}">डिलीट</button>
                `;
                entryList.appendChild(div);
            });

            // Attach Delete Event Listeners
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const key = e.target.getAttribute('data-key');
                    if (confirm('क्या आप सच में यह एंट्री डिलीट करना चाहते हैं?')) {
                        remove(ref(db, `entries/${key}`));
                    }
                });
            });
        }

        // Calculate Summary Totals
        function calculateSummary() {
            let totalMilk = 0;
            let totalAdvance = 0;

            Object.values(dairyEntries).forEach(entry => {
                totalMilk += entry.quantity;
                totalAdvance += entry.advance;
            });

            const totalAmount = totalMilk * currentPrice;
            const netDue = totalAmount - totalAdvance;

            document.getElementById('totalMilk').innerText = `${totalMilk.toFixed(1)} L`;
            document.getElementById('totalAmount').innerText = `₹${totalAmount.toFixed(2)}`;
            document.getElementById('totalAdvance').innerText = `₹${totalAdvance.toFixed(2)}`;
            document.getElementById('netDue').innerText = `₹${netDue.toFixed(2)}`;
        }
    </script>
</body>
</html>
